<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classes</title>

    <link rel="stylesheet" href="classes.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

<div class="page">

    <aside class="sidebar">

        <div class="menu-icon">
            <i class="fa-solid fa-bars"></i>
        </div>

        <div class="nav-links">

            <div class="nav-item">
                <i class="fa-solid fa-house"></i>
                <span>HOME</span>
            </div>

            <div class="nav-item active">
                <i class="fa-solid fa-chalkboard-user"></i>
                <span>CLASSES</span>
            </div>

            <div class="nav-item">
                <i class="fa-regular fa-comments"></i>
                <span>FAQ</span>
            </div>

            <div class="nav-item">
                <i class="fa-regular fa-bell"></i>
                <span>NOTIFICATIONS</span>
            </div>

        </div>

        <div class="settings">
            <i class="fa-solid fa-gear"></i>
        </div>

    </aside>

    <main class="content">

        <div class="top-bar">

            <div class="search-bar">
                <i class="fa-solid fa-search"></i>

                <input
                    type="text"
                    placeholder="Search classes..."
                >

                <i class="fa-solid fa-microphone"></i>
            </div>

            <div class="top-right">
                <button class="logo-btn">
                    LOGO
                </button>

                <div class="profile-icon">
                    <i class="fa-regular fa-user"></i>
                </div>
            </div>

        </div>

        <div class="heading-row">
            <h1>MY CLASSES</h1>

            <button id="addClassBtn" class="add-class-btn" title="Add a class">
                <i class="fa-solid fa-plus"></i>
            </button>
        </div>

        <!-- Shown when there are no classes yet -->
        <p id="emptyState" class="empty-state hidden">
            No classes yet.
        </p>

        <section class="classes-grid" id="classesGrid">
        </section>

    </main>

</div>

<div id="addClassModal" class="modal-overlay hidden">
    <div class="modal-box">
        <h2>Add a Class</h2>

        <label for="classNameInput">Class Name</label>
        <input type="text" id="classNameInput" placeholder="e.g. CS 24000" maxlength="20">

        <div class="modal-actions">
            <button id="cancelAddClassBtn" class="modal-btn cancel-btn">Cancel</button>
            <button id="confirmAddClassBtn" class="modal-btn confirm-btn">Create</button>
        </div>
    </div>
</div>

<template id="classCardTemplate">
    <div class="class-card">
        <button class="delete-class-btn" title="Remove class">&times;</button>
        <h2 class="class-title"></h2>
        <div class="card-menu">
            <a class="menu-btn office-hours-link">Office Hours</a>
            <a class="menu-btn ta-reviews-link">TA Reviews</a>
            <a class="menu-btn faq-link">FAQ</a>
        </div>
    </div>
</template>

<script src="classes.js"></script>

</body>
</html>
