<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="adminStyle.css">
</head>
<body>
	<div class="wrapper">
	<h1 class="title">Classes</h1>
	<button class="menu_btn" id="menuBtn">☰</button>
	<nav id="navBar">
        <ul>
			<li><button class="nav_btn" id="homeBtn">Home</button></li>
			<li><button class="nav_btn" id="faqBtn">FAQ Posts</button></li>
			<li class="nav_settings"><button class="nav_btn" id="settingsBtn">Settings</button></li>
		</ul>            
    </nav>
	
	<main>
		<header>
        	<div class="top_bar">
            	<button id="signOutBtn">Sign Out</button>
        	</div>
    	</header>

		<div class="tabs-container" id="tabsDiv">
            <!-- CONTAINER -->
            <input type="radio" name="tabs" id="tab1" checked>
			<label for="tab1">CS240</label>
			<div class="tab-content">
				<h3>CS240</h3>
				<p>Choose a TA to view feedback:</p>
				<button class="selectBtn" id="selectBtn">select</button>
				<select name="tas" id="taDrop">
					<!-- DROPDOWN -->
				</select>
				<div id="feedback">
					<!-- CONTENT -->
				</div><hr style="margin-top: 15px;">
				<div id="office-hours">
					<!-- CONTENT -->
				</div>
			</div>
        </div>

		<div class="create-office-hour">
			<h3>Create new office hour:</h3>
			<form>
				<label for="cname">Class Name:</label>
				<input type="text" id="cname" name="cname"><br>

				<label for="dow">Day of the week:</label>
				<select name="dow" id="dow">
					<option value="m">Monday</option>
					<option value="t">Tuesday</option>
					<option value="w">Wednesday</option>
					<option value="r">Thursday</option>
					<option value="f">Friday</option>
					<option value="s">Saturday</option>
					<option value="n">Sunday</option>
				</select><br>

				<label for="stime">Start time:</label>
				<input type="text" id="stime" name="stime"><br>

				<label for="etime">End time:</label>
				<input type="text" id="etime" name="etime"><br>

				<label for="loc">Location:</label>
				<input type="text" id="loc" name="loc"><br>
			</form>
			<button id="createOhBtn">create</button>
		</div>
	</main>
	</div>
	<script src="admin.js"></script>
</body>
</html>
